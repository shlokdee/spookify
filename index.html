<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spookify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>spookify</h1>
    <button onclick="animationstart()">Start</button>
    <canvas id="dropper" width="500" height="300"></canvas>
    <div id="keyboard">
    
    </div>
    <div id="synth">
        <select name="tonetype" id="tonetype">
            <option value="sawtooth" selected>sawtooth</option>
            <option value="triangle">triangle</option>
            <option value="sine">sine</option>
            <option value="square">square</option>
        </select>
        <label for="tonetype">Select the type of main tone</label>

        <select name="detunetype" id="detunetype">
            <option value="sawtooth" selected>sawtooth</option>
            <option value="triangle">triangle</option>
            <option value="sine">sine</option>
            <option value="square">square</option>
        </select>
        <label for="detunetype">Select the type of detune tone</label>

        <select name="lfotype" id="lfotype">
            <option value="sawtooth">sawtooth</option>
            <option value="triangle">triangle</option>
            <option value="sine" selected>sine</option>
            <option value="square">square</option>
        </select>
        <label for="lfotype">Select the type of lfo pattern</label>

        <input name="detuneval" type="number" value="50" id="detuneval">
        <label for="detuneval">set the number of detune cents (100 cents = 1 semitone)</label>

        <input name="lfofreq" type="number" value="15" id="lfofreq">
        <label for="lfofreq">set the frequency for the low frequency oscillator</label>

        <input name="lfogainselec" type="number" value="15" id="lfogainselec">
        <label for="lfogainselec">set the gain for the low frequency oscillator</label>

        <input name="volgain" type="number" value="0.2" id="volgain">
        <label for="volgain">set the gain for master volume (sound will tear if sum of gains of simultaneous key presses goes above one)</label>
    </div>
    <script src="script.js"></script>
</body>
</html>
